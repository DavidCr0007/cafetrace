services:
  # Base de Datos Relacional PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cafetrace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: cafetrace
    # Solo disponible en la red interna de Docker. Para mantenimiento local
    # use un perfil/compose de desarrollo, nunca el compose de producción.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafetrace -d cafetrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafetrace-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: "CaféTrace IA"
      API_V1_STR: "/api/v1"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cafetrace}:${POSTGRES_PASSWORD}@db:5432/cafetrace"
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY in the environment}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: "${CORS_ORIGINS:?Define CORS_ORIGINS as a JSON allowlist}"
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-80002}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      BLOCKCHAIN_CONFIRMATIONS: ${BLOCKCHAIN_CONFIRMATIONS:-1}
      BLOCKCHAIN_TX_TIMEOUT_SECONDS: ${BLOCKCHAIN_TX_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Aplicación Web Frontend Next.js 14
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafetrace-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
